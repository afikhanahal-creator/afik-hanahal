# Twice a day: delete old Vercel deployments of every project of the team (the Afik Hanahal site and Kurkoos share 10 GB of
# Deployment Storage on the free plan — 75 % on 2026-11-02 and again on 2026-11-16). Keeps the 3 newest production
# deployments of each project and everything from the last day; previews and failed builds go after a day
# (lib/vercel-cleanup.js, tested). Needs the VERCEL_TOKEN secret; without it the run FAILS (it used to pass doing nothing).
# Manual run: Actions → Vercel cleanup → Run workflow (dry_run = only count).
name: Vercel cleanup
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only count, delete nothing'
        type: boolean
        default: false
concurrency:
  group: vercel-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            lib/vercel-cleanup.js
            scripts/vercel-cleanup.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean up
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/vercel-cleanup.mjs
